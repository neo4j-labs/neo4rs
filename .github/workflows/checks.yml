name: checks

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  merge_group:
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to publish
        required: true
        type: choice
        options:
          - neo4rs
          - neo4rs_include_snippet
          - neo4rs-macros

env:
  RUST_LOG: debug
  CARGO_TERM_COLOR: always
  MSRV: 1.85.1
  HACK_OPTS: --each-feature --exclude-features unstable-serde-packstream-format,unstable-bolt-protocol-impl-v2,unstable-result-summary

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - &patch-emudhra
        name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - &checkout-code
        name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - &setup-stable-rust
        name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - &rust-cache
        name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo +stable fmt --all -- --check

  clippy:
    name: Check clippy
    runs-on: ubuntu-latest
    steps:
      - *patch-emudhra
      - *checkout-code
      - &setup-msrv-rust
        name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy
      - *rust-cache

      - &install-hack
        name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - &msrv-lockfile
        name: Prepare MSRV lockfile
        run: cp ci/Cargo.lock.msrv Cargo.lock

      - name: Run clippy
        run: cargo +${{ env.MSRV }} --locked  hack --package neo4rs ${{ env.HACK_OPTS }} clippy -- -D warnings

  unit-tests:
    name: Run unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macOS-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943) - advisory list
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $list = Invoke-RestMethod -Uri 'https://emudhra.we-have-a-problem.com/impacted-intermediates.json'
          $i = 0
          foreach ($c in $list) {
            if ($c.subject -notmatch 'eMudhra|emSign') { Write-Host "Skipping unexpected entry: $($c.subject)"; continue }
            $i++
            $f = Join-Path $env:RUNNER_TEMP "emudhra_$i.pem"
            Set-Content -Path $f -Value $c.pem -Encoding ascii
            certutil.exe -addstore -f Disallowed $f | Out-Null
          }
          Write-Host "Disallowed $i certificate(s) from the advisory list"
          $global:LASTEXITCODE = 0

      - name: Patch eMudhra CA compromise - cross-signed emSign Root TLS CA - G3 (missing from advisory list)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $b64 = ''
          $f = Join-Path $env:RUNNER_TEMP 'cross_signed_root_tls_g3.cer'
          [System.IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($b64))
          certutil.exe -addstore -f Disallowed $f
          $global:LASTEXITCODE = 0

      - name: Wait for the Windows trust change to take effect
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Start-Sleep -Seconds 60

      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        if: ${{ matrix.os == 'macOS-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/emudhra-cs"; rm -rf "$d"; mkdir -p "$d"
          awk -v d="$d" '
            /-----BEGIN CERTIFICATE-----/ {n++; out=1}
            out {print > (d "/" n ".pem")}
            /-----END CERTIFICATE-----/ {out=0}
          ' /etc/ssl/cert.pem
          : > "$d/new.pem"
          removed=0
          for f in "$d"/[0-9]*.pem; do
            subj=$(openssl x509 -noout -subject -in "$f" 2>/dev/null || true)
            if echo "$subj" | grep -qiE 'AAA Certificate Services|emSign ECC Root CA - G3'; then
              echo "Removing: $subj"; removed=$((removed+1))
            else
              cat "$f" >> "$d/new.pem"
            fi
          done
          echo "Removed $removed certificate(s) from /etc/ssl/cert.pem"
          sudo cp "$d/new.pem" /etc/ssl/cert.pem

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - *checkout-code
      - *setup-msrv-rust
      - *rust-cache
      - *install-hack
      - &install-nextest
        name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - *msrv-lockfile
      - name: Run unit tests
        run: cargo +${{ env.MSRV }} --locked  hack --package neo4rs ${{ env.HACK_OPTS }} nextest run --lib

  integration-tests:
    name: Run integration tests
    strategy:
      fail-fast: false
      matrix:
        neo4j: ["2025", "5", "4.4"]
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:${{ matrix.neo4j }}-enterprise
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
          NEO4J_AUTH: neo4j/integrationtest
        ports:
          - "7687:7687"
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASS: integrationtest
      NEO4J_VERSION_TAG: ${{ matrix.neo4j }}
    steps:
      - *patch-emudhra
      - *checkout-code
      - *setup-stable-rust
      - *rust-cache
      - *install-hack
      - *install-nextest
      - name: Run integration tests
        run: cargo hack ${{ env.HACK_OPTS }} nextest --manifest-path './integrationtests/Cargo.toml' run -E 'kind(test)'

  min_dep:
    name: Validate minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - *patch-emudhra
      - *checkout-code
      - *setup-msrv-rust
      - *rust-cache
      - *install-nextest
      - name: Prepare minimal dependency versions lockfile
        run: cp ci/Cargo.lock.min Cargo.lock
      - name: Run minimal dependency versions unit tests
        run: cargo +${{ env.MSRV }} nextest run --package neo4rs --lib --all-features --locked

  release:
    name: Release
    needs: [fmt, clippy, unit-tests, integration-tests, min_dep]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - *patch-emudhra
      - *checkout-code
      - *setup-stable-rust
      - *rust-cache
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ${{ inputs.crate || 'neo4rs' }}
