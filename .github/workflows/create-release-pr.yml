name: Open a PR for a new release

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to release
        required: true
        type: choice
        options:
          - neo4rs
          - neo4rs_include_snippet
          - neo4rs-macros
      version:
        description: >-
          What version to release.
          Can be one of 'major', 'minor', 'patch', or a concrete version.
          See https://github.com/crate-ci/cargo-release/blob/7527065e413b9625ccb09800b765f6c49d011c79/docs/reference.md#bump-level for more details.
        required: true
        type: string
      skip_semver:
        description: Skip SemVer Checks, only use this for new releases
        required: false
        type: boolean

env:
  RUSTUP_TOOLCHAIN: stable
  MSRV: 1.85.1

jobs:
  make-release-pr:
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 2

      - uses: chainguard-dev/actions/setup-gitsign@0cda751b114eb55c388e88f7479292668165602a # v1.0.2

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 #v2.9.3

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 #master
        with:
          toolchain: nightly

      - name: Set up Rust MSRV
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 #master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 #master
        with:
          toolchain: stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-semver-checks

      - name: Install cargo-workspaces
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-workspaces

      - name: Install cargo-release
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-release

      - uses: cargo-bins/release-pr@dca4a39944c532bbde5e485142fb05a8158edec1 #v2.1.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          crate-name: ${{ inputs.crate || 'neo4rs' }}
          pr-title: "Set <%= crates.length === 1 ? crates[0].name : '' %> version to <%= version.actual %>"
          check-semver: ${{ inputs.skip_semver != true }}
          base-branch: main
